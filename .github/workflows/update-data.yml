name: update-dashboard-data

on:
  workflow_dispatch:
  schedule:
    - cron: '20 13 * * 1-5'

permissions:
  contents: write
  issues: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      FRED_SACRAMENTO_UR_SERIES_ID: ${{ secrets.FRED_SACRAMENTO_UR_SERIES_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: |
          python -m pip install --upgrade pip
          pip install requests
      - run: python scripts/update_unemployment.py
      - run: python scripts/update_fed.py
      - run: python scripts/update_gas.py
      - run: python scripts/update_disasters.py
      - run: python scripts/update_stocks.py
      - run: python scripts/update_materials.py
      - run: python scripts/update_news.py
      - run: python scripts/update_competitor_signals.py
      - run: python scripts/update_labor.py
      - run: python scripts/update_build_meta.py
      - run: python scripts/validate_data.py
      - run: node scripts/validate_dashboard_content.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update dashboard data"
          git push
      - name: Alert on failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Dashboard data refresh is failing"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN_URL"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "The scheduled data refresh failed, so the published dashboard is not updating. Failed run: $RUN_URL. Close this issue once a run succeeds."
          fi
      - name: Close alert on recovery
        if: success() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Dashboard data refresh is failing"
          for n in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[].number'); do
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "Recovered: $RUN_URL"
          done
